name: MGCOL2 DiPlay Android 5.1 debug test
on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android packages
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'ndk;28.2.13676358'
          yes | sdkmanager --licenses || true
      - name: Build DiPlay test APK (no CarPlay identity)
        run: |
          chmod +x ./gradlew
          ./gradlew :mobile:assembleDebug --stacktrace
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-MGCOL2-Android5-TestOnly
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
